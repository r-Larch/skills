# Publishes the WorkState server image that plugins/rlarch/skills/workstate-setup/assets/compose.yml pulls.
# Never runs on pull_request: a fork's branch must not be able to push to the package.

name: workstate-image

on:
  push:
    branches: [master]
    paths:
      - "mcp/**"
      - ".github/workflows/workstate-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workstate-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/r-larch/workstate-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the server's own version, so it cannot drift from what /health and server/discover report.
      - name: Read ServerInfo.Version
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*Version = "\([0-9][^"]*\)",.*$/\1/p' mcp/WorkState.Api/ApiHost.cs | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=mcp/WorkState.Api/ApiHost.cs::no ServerInfo Version = \"x.y.z\" line found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "WorkState $version"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/r-Larch/skills
            org.opencontainers.image.title=workstate-api
            org.opencontainers.image.description=WorkState MCP server: the work tracker behind rlarch orchestrate and controller
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
